name: Global market signal check

on:
  schedule:
    # User-selected daytime window 08:30-17:00 Thailand = 01:30-10:00 UTC
    - cron: "30,45 1 * * *"
    - cron: "0,15,30,45 2-9 * * *"
    - cron: "0 10 * * *"
    # User-selected evening window 20:00-23:00 Thailand = 13:00-16:00 UTC
    - cron: "0,15,30,45 13-15 * * *"
    - cron: "0 16 * * *"
    # The 01:30 UTC run also sends the daily 08:30 Thailand heartbeat.
  workflow_dispatch:

concurrency:
  group: signal-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SYMBOLS: ${{ vars.SYMBOLS || 'EURUSD,GBPUSD,USDJPY,AUDUSD,USDCHF,XAUUSD,BTCUSD,THAISET,US500,NAS100,NIKKEI225,SHANGHAI' }}
      ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE || '10000' }}
      RISK_PERCENT: ${{ vars.RISK_PERCENT || '1' }}
      HIGHER_TIMEFRAME: ${{ vars.HIGHER_TIMEFRAME || 'H4' }}
      REQUIRE_HTF_CONFIRMATION: ${{ vars.REQUIRE_HTF_CONFIRMATION || 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore alert state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: signal-state-${{ github.run_id }}
          restore-keys: signal-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_once.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: signal-state-${{ github.run_id }}
